# CodeRabbit reviews this repo's PRs on request only. Changes are reviewed before the PR, with
# the CodeRabbit CLI (`coderabbit review --committed --base origin/main`) and an independent
# agent review; see docs/DEVELOPING.md. Automatic PR reviews spent the hourly allowance on every
# push and kept it at one review an hour. Ask for a PR review with `@coderabbitai review`.
reviews:
  auto_review:
    enabled: false
  # Generated files: eval receipts and patches, image renders and the drift snapshot. Their
  # content is checked by tests and gates, and reading them spends a review on noise.
  path_filters:
    - "!evals/results/**"
    - "!**/*.png"
    - "!okl-drift.json"
