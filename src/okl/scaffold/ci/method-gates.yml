# `okl scaffold` installs this as .github/workflows/method-gates.yml.
# Surface 5 in CI: the mechanical drift-gates + the eval tier. Fail-closed — a red gate blocks merge.
name: method-gates

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs read code and report a status. Neither writes.
permissions:
  contents: read

concurrency:
  group: method-gates-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Without pipefail a run block continues past a failed segment of a pipeline, so a
    # green step can hide a red command — which defeats the point of a fail-closed gate.
    shell: bash -euo pipefail {0}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable, so `@v5` is an unpinned
      # dependency with access to your runner. `okl scaffold` also installs
      # .github/dependabot.yml (the `github-actions` ecosystem) so these pins receive security
      # updates — a pin with no update path goes stale, which is its own risk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run drift-gates (retractions / tombstones / doc-orphans / links / diagram-pairs / canon-size)
        run: bash gates/run-gates.sh

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Run eval tier (leads with its own failure count; blocks if RESULTS NOT USABLE)
        env:
          GENERATOR_MODEL: ${{ vars.GENERATOR_MODEL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}   # must differ from GENERATOR_MODEL
        # Exit 2 = did not run: no cases file, an empty one, or one still holding <<FILL
        # placeholders, so nothing was measured. A new kit starts there, so that is a warning,
        # not a red build and not a pass. Any other failure fails the job.
        run: |
          set +e
          python evals/run_evals.py --fail-rate 0.20
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=Evals not measured::evals/cases.jsonl is missing, empty, or still holds <<FILL placeholders, so nothing was measured. This step passing is NOT a result."
            exit 0
          fi
          exit "$rc"

  review:
    # The architecture reviewer, run headless on the PR diff. OFF unless you set the
    # REVIEW_CMD repository variable to a CLI that takes a prompt on stdin — any vendor,
    # or a local model. Installing the kit costs you nothing and calls nobody's API.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the reviewer diffs against the base branch
          persist-credentials: false
      - name: Architecture review (off unless REVIEW_CMD is set)
        env:
          REVIEW_CMD: ${{ vars.REVIEW_CMD }}
          # Whatever credential your REVIEW_CMD needs, named by you. Unset is fine.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_BASE_REF: origin/${{ github.base_ref }}
        run: bash ci/review-agent.sh

      # The review after writing, on every pull request: one call picks the ten lessons the change
      # is likeliest to break and one fresh call checks each (ci/lesson-review.sh). Eleven calls a
      # run, so it is off until you also set the LESSON_REVIEW repository variable to "on". It
      # reports in this job's summary and blocks nothing unless LESSON_REVIEW_BLOCKING is "1".
      # Both steps need REVIEW_CMD too: without it there is nothing to run, and installing okl and
      # seeding every pack first would be work for a soft pass.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: vars.LESSON_REVIEW == 'on' && vars.REVIEW_CMD != ''
        with:
          python-version: "3.13"
      - name: Lesson review (off unless LESSON_REVIEW is on and REVIEW_CMD is set)
        if: vars.LESSON_REVIEW == 'on' && vars.REVIEW_CMD != ''
        env:
          REVIEW_CMD: ${{ vars.REVIEW_CMD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_BASE_REF: origin/${{ github.base_ref }}
          # What the change says it does, passed as data, never interpolated into the script.
          REVIEW_PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
          LESSON_REVIEW_BLOCKING: ${{ vars.LESSON_REVIEW_BLOCKING }}
          # Your shared store, if you run one. Without it the review reads okl's bundled packs:
          # the lessons you record stay in your gitignored .okl/.
          OKL_SERVICE_URL: ${{ secrets.OKL_SERVICE_URL }}
          OKL_TOKEN: ${{ secrets.OKL_TOKEN }}
        run: |
          # .github/okl-version pins the okl release, as okl-verify.yml reads it.
          if [[ -s .github/okl-version ]]; then
            pip install "observed-knowledge-ledger==$(tr -d '[:space:]' < .github/okl-version)"
          else
            pip install observed-knowledge-ledger
          fi
          if [[ -z "$OKL_SERVICE_URL" ]]; then
            export OKL_DATABASE_URL="sqlite:///$RUNNER_TEMP/lessons.db" OKL_BRIEFING_LOG=0
            export LESSON_REVIEW_STORE_NOTE="Checked against okl's bundled packs only: the lessons this repository recorded stay in its gitignored .okl/."
            okl seed --all > /dev/null
          fi
          bash ci/lesson-review.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # Optional: emit VERIFIED_ON receipts to the org knowledge layer when gates pass.
  # See okl README + ci/okl-verify.yml.
