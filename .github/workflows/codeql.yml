# CodeQL — GitHub's static analysis, free for public repositories.
#
# Worth having here specifically: okl ships an authenticated HTTP service, shells out to
# git, opens URLs from user config, and installs onto other people's machines. ruff's
# `S` rules catch the well-known shapes; CodeQL does dataflow, so it can follow a value
# from a request body to a sink across functions in a way a linter cannot.
#
# Results appear under Security → Code scanning, and can be made a required check via
# branch protection once the first run establishes a baseline.
name: codeql

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly, because CodeQL's queries improve over time: code that was clean when it
    # merged can be newly flagged without anyone touching it. A repo that only scans on
    # push never learns about those.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF results
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: python
          # security-extended adds the lower-severity security queries; this is a small
          # codebase and the extra noise is affordable.
          queries: security-extended

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          category: "/language:python"
