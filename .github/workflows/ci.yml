# Repo CI — lints and tests okl itself. (okl-verify.yml is different: it demonstrates
# the product's own drift/method gates, the workflow consumers copy into their repos.)
name: ci
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The diagram gate reads committed history (git show HEAD:...), not the
          # checkout tree, so it needs more than the default shallow fetch of one ref.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (dev extras)
        run: pip install -e ".[dev]"
      - name: Lint — ruff (config in pyproject.toml)
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Diagram figures trace to committed receipts
        run: ./ci/check-diagram-figures.sh
