# Repo CI — lints, type-checks and tests okl itself. (okl-verify.yml is different: it
# demonstrates the product's own drift/method gates, the workflow consumers copy.)
#
# Hardened per the org rule this repo's own store carries ("CI workflow baseline:
# pipefail, no persisted credentials, least-privilege permissions, concurrency groups —
# pin actions"). It satisfied none of the five until this commit, which is the rule's own
# symptom: an enforcement surface nothing triggers runs never.
name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: this job reads code and reports status. It never pushes.
permissions:
  contents: read

# One run per ref. A superseded push should stop burning minutes on a result nobody
# will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Without pipefail a run block continues past a failed segment of a pipeline, so a
    # green step can hide a red command.
    shell: bash -euo pipefail {0}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The Postgres backend against a real server, for the test step below. Its tests skipped
    # everywhere until this (nothing set OKL_TEST_POSTGRES_URL), so Postgres changes reached
    # main untested: the architecture reviewer's second sighting of that class (#300). Trust
    # auth: the server lives for this job only, and no password-shaped string is in the repo.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: okl
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      # Actions pinned to a commit SHA, not a tag: a tag is mutable, so `@v5` is an
      # unpinned dependency with write access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The diagram gate reads committed history (git show HEAD:...), not the
          # checkout tree, so it needs more than the default shallow fetch.
          fetch-depth: 0
          # This job never pushes; leaving the token in .git/config lets any later step
          # (or a compromised dependency) use it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install (dev extras)
        # --group needs pip 25.1 or later (PEP 735 dependency groups).
        run: |
          python -m pip install "pip>=25.1"
          pip install -e . --group dev

      # uv.lock is the environment `uv sync` builds. This job installs with pip and never
      # read it, so it fell weeks behind pyproject.toml, still holding a filelock with six
      # advisories after the fix had shipped (#285). The build fails the day they disagree.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Lint — ruff (config in pyproject.toml)
        run: ruff check .

      - name: Types — mypy
        run: mypy src/okl

      # The architecture test: the layers contract in pyproject.toml fails the first
      # import that points up (store -> core, core -> client, ...).
      - name: Architecture — import-linter
        run: lint-imports

      # A Postgres test without the server's URL fails here rather than skips: the server
      # above exists so they run (tests/test_okl.py's _postgres_url).
      - name: Tests (with the coverage ratchet, and Postgres)
        env:
          OKL_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/okl
          OKL_TEST_POSTGRES_REQUIRED: "1"
        run: pytest -q --cov=okl

      - name: Diagram figures trace to committed receipts
        run: ./ci/check-diagram-figures.sh

      # The content audits okl ships to consumers, run against okl itself. They were
      # shipped for weeks without this repo running any of them — the "enforcement
      # surface nothing triggers" failure, one level up: a gate whose author has never
      # run it on their own tree.
      - name: Method gates (links, doc orphans, diagram pairs, tombstones, canon size)
        run: bash gates/run-gates.sh

      # Secret scan over the FULL history, not the working tree. okl writes a bearer
      # token into .okl/config.json, and the .gitignore it now drops there is the only
      # thing between that and a commit — this is the check for when that fails.
      #
      # The upstream gitleaks-action is deliberately not used: it requires a paid licence
      # key for organization-owned repositories, so it would break for anyone who forks
      # this into an org. The binary has no such condition, and pinning the release keeps
      # a new detection rule from retro-failing a branch that changed nothing.
      # The reviewer okl ships, run on okl. It was listed as a review surface with nothing
      # triggering it — the "enforcement surface that only runs on-demand runs never"
      # failure this repo's own store names. It runs on the maintainer's Claude subscription:
      # CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`, bills the subscription and not the
      # API (no ANTHROPIC_API_KEY here, which would outrank it; --bare would ignore it).
      # Without that secret, and on a fork's PR, which gets no secrets, it soft-passes; the
      # REVIEW_CMD variable swaps in any other CLI. The script runs it from a clean room, so
      # this repo's hooks never fire on it, and --add-dir lets it read the checkout to hold
      # each figure to its receipt. It fails the job on a must-fix finding only.
      - name: Architecture review (on the maintainer's Claude subscription)
        if: github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_CMD: ${{ vars.REVIEW_CMD }}
          REVIEW_BASE_REF: origin/${{ github.base_ref }}
          # What the change says it does, passed as data: interpolated into the script, a PR
          # title could run as shell. The reviewer is told it is a claim, not instructions.
          REVIEW_PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
          # Pinned, as every tool that gates CI is: a release cannot change the gate unseen.
          CLAUDE_CODE_VERSION: "2.1.302"
        run: |
          if [[ -z "$REVIEW_CMD" && -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            # The platform package is the native binary itself and runs no install script,
            # so npm can refuse lifecycle scripts outright.
            npm install --ignore-scripts --no-fund --no-audit --prefix "$RUNNER_TEMP/claude" \
              "@anthropic-ai/claude-code-linux-x64@$CLAUDE_CODE_VERSION"
            CLAUDE_BIN="$RUNNER_TEMP/claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
            chmod +x "$CLAUDE_BIN"
            # Read-only git, so it can check that a receipt's commit is reachable: allowed by a
            # settings file, since the command line is word-split; GIT_DIR points the clean
            # room's git at the checkout. Only forms that cannot write, while the token is in the
            # environment and the model reads PR text: not branch or tag, which create and delete
            # refs (CI reviewer on #307), and not log or show, whose --output writes a file
            # (CodeRabbit on #307). Any other shell command is refused in -p mode.
            printf '%s' '{"permissions":{"allow":["Bash(git merge-base:*)","Bash(git rev-parse:*)"]}}' \
              > "$RUNNER_TEMP/review-settings.json"
            export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$GITHUB_WORKSPACE"
            REVIEW_CMD="$CLAUDE_BIN -p --model sonnet --max-turns 40 --tools Read,Grep,Glob,Bash --settings $RUNNER_TEMP/review-settings.json --add-dir $GITHUB_WORKSPACE"
          fi
          # The knowledge layer's briefing for this change, from the seed packs in a store that
          # lives for this step; this repo's own recorded lessons stay on the maintainer's
          # machine, so the reviewer is told the briefing is the packs' only.
          export OKL_DATABASE_URL="sqlite:///$RUNNER_TEMP/review.db" OKL_BRIEFING_LOG=0
          briefing="$RUNNER_TEMP/briefing.md"
          if okl seed seed/ >/dev/null 2>&1 \
             && okl check --task "$REVIEW_PR_TITLE. ${REVIEW_PR_BODY:0:600}" --format agent > "$briefing" 2>/dev/null; then
            printf '\n(From the seed packs only: lessons recorded on the maintainer machine are not in CI.)\n' >> "$briefing"
          else
            briefing=""
          fi
          REVIEW_CMD="$REVIEW_CMD" REVIEW_REPO_DIR="$GITHUB_WORKSPACE" REVIEW_BRIEFING_FILE="$briefing" \
            bash ci/review-agent.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Secret scan — gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          # --proto =https: a redirect may not downgrade the download to plain HTTP.
          curl -sSfL --proto '=https' --tlsv1.2 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  # pyproject says requires-python >=3.11, and the job above tests one version, so the
  # rest of that claim was assumed rather than tested. This runs the suite on every
  # other version it covers. Lint, types, coverage and the gates stay in the job above:
  # they read the source, and the coverage ratchet was measured on that one version.
  tests-other-pythons:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: which versions break is the
      # information this job exists to give.
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.13", "3.14", "3.15" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras)
        # --group needs pip 25.1 or later (PEP 735 dependency groups).
        run: |
          python -m pip install "pip>=25.1"
          pip install -e . --group dev

      - name: Tests
        run: pytest -q
