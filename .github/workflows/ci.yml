# Repo CI — lints, type-checks and tests okl itself. (okl-verify.yml is different: it
# demonstrates the product's own drift/method gates, the workflow consumers copy.)
#
# Hardened per the org rule this repo's own store carries ("CI workflow baseline:
# pipefail, no persisted credentials, least-privilege permissions, concurrency groups —
# pin actions"). It satisfied none of the five until this commit, which is the rule's own
# symptom: an enforcement surface nothing triggers runs never.
name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: this job reads code and reports status. It never pushes.
permissions:
  contents: read

# One run per ref. A superseded push should stop burning minutes on a result nobody
# will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Without pipefail a run block continues past a failed segment of a pipeline, so a
    # green step can hide a red command.
    shell: bash -euo pipefail {0}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The Postgres backend against a real server, for the test step below. Its tests skipped
    # everywhere until this (nothing set OKL_TEST_POSTGRES_URL), so Postgres changes reached
    # main untested: the architecture reviewer's second sighting of that class (#300). Trust
    # auth: the server lives for this job only, and no password-shaped string is in the repo.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: okl
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      # Actions pinned to a commit SHA, not a tag: a tag is mutable, so `@v5` is an
      # unpinned dependency with write access to the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The diagram gate reads committed history (git show HEAD:...), not the
          # checkout tree, so it needs more than the default shallow fetch.
          fetch-depth: 0
          # This job never pushes; leaving the token in .git/config lets any later step
          # (or a compromised dependency) use it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install from the lockfile
        # The versions uv.lock holds, not a fresh resolve, so CI tests what `uv sync` builds
        # (#331). --locked fails the day uv.lock and pyproject.toml disagree: the job used to
        # install with pip and check the lockfile in a step of its own, after uv.lock fell
        # weeks behind, still holding a filelock with six advisories (#285). uv itself comes
        # at the version pyproject.toml pins for it.
        run: |
          python -m pip install "$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"] if isinstance(d, str) and d.startswith("uv==")))')"
          uv sync --locked --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Each check's output is kept for the review job below: the reviewer runs nothing while the
      # subscription token is in its environment, so what these report reaches it as input.
      - name: Lint — ruff (config in pyproject.toml)
        run: |
          mkdir -p "$RUNNER_TEMP/ci-results"
          ruff check . 2>&1 | tee "$RUNNER_TEMP/ci-results/ruff.log"

      - name: Types — mypy
        run: mypy src/okl 2>&1 | tee "$RUNNER_TEMP/ci-results/mypy.log"

      # The architecture test: the layers contract in pyproject.toml fails the first
      # import that points up (store -> core, core -> client, ...).
      - name: Architecture — import-linter
        run: lint-imports 2>&1 | tee "$RUNNER_TEMP/ci-results/import-linter.log"

      # A Postgres test without the server's URL fails here rather than skips: the server
      # above exists so they run (tests/test_okl.py's _postgres_url).
      - name: Tests (with the coverage ratchet, and Postgres)
        env:
          OKL_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/okl
          OKL_TEST_POSTGRES_REQUIRED: "1"
        run: pytest -q --cov=okl 2>&1 | tee "$RUNNER_TEMP/ci-results/pytest.log"

      # Each guard install.py relies on (every symlink refusal, found by reading the code) is
      # switched off in turn, and a test must fail: reviews kept finding guards that could be
      # deleted with every test passing; plus the guards listed in its MUTATIONS. A few minutes.
      - name: Guards are held by tests (each one switched off fails a test)
        run: python ci/check-guard-mutations.py

      - name: Diagram figures trace to committed receipts
        run: ./ci/check-diagram-figures.sh

      # The drawn architecture diagrams (docs/architecture/) name commands, flags, MCP tools,
      # hook events, scripts and briefing marks. okl's last hand-drawn diagram was retired
      # wrong in four places nothing checked (93933d7); this fails on a name the code lacks,
      # and on an .svg that does not carry its source's text (#415).
      - name: Diagram names exist in the code
        run: python3 ci/check-diagram-names.py

      # The content audits okl ships to consumers, run against okl itself. They were
      # shipped for weeks without this repo running any of them — the "enforcement
      # surface nothing triggers" failure, one level up: a gate whose author has never
      # run it on their own tree.
      - name: Method gates (links, doc orphans, diagram pairs, tombstones, canon size)
        run: bash gates/run-gates.sh

      # Secret scan over the FULL history, not the working tree. okl writes a bearer
      # token into .okl/config.json, and the .gitignore it now drops there is the only
      # thing between that and a commit — this is the check for when that fails.
      #
      # The upstream gitleaks-action is deliberately not used: it requires a paid licence
      # key for organization-owned repositories, so it would break for anyone who forks
      # this into an org. The binary has no such condition, and pinning the release keeps
      # a new detection rule from retro-failing a branch that changed nothing.
      # What the checks above reported, for the review job, whether they passed or failed.
      - name: Keep the check results for the review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-results-lint-and-test
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Secret scan — gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          # --proto =https: a redirect may not downgrade the download to plain HTTP.
          curl -sSfL --proto '=https' --tlsv1.2 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  # pyproject says requires-python >=3.11, and the job above tests one version, so the
  # rest of that claim was assumed rather than tested. This runs the suite on every
  # other version it covers. Lint, types, coverage and the gates stay in the job above:
  # they read the source, and the coverage ratchet was measured on that one version.
  tests-other-pythons:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: which versions break is the
      # information this job exists to give.
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.13", "3.14", "3.15" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from the lockfile
        # The versions uv.lock holds, not a fresh resolve, so CI tests what `uv sync` builds
        # (#331). --locked fails the day uv.lock and pyproject.toml disagree: the job used to
        # install with pip and check the lockfile in a step of its own, after uv.lock fell
        # weeks behind, still holding a filelock with six advisories (#285). uv itself comes
        # at the version pyproject.toml pins for it.
        run: |
          python -m pip install "$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"] if isinstance(d, str) and d.startswith("uv==")))')"
          uv sync --locked --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Tests
        run: |
          mkdir -p "$RUNNER_TEMP/ci-results"
          pytest -q 2>&1 | tee "$RUNNER_TEMP/ci-results/pytest.log"

      - name: Keep the test results for the review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 3

  # okl end to end, as a user gets it: a wheel built from this commit, installed fresh with the
  # MCP extra into a clean virtualenv, then driven on a scratch repository by ci/e2e.py: init on
  # a monorepo with a folder it cannot read, the prompt and Stop hooks fed the JSON Claude Code
  # sends, the loop from record to re-verify with the pre-push gate, a stamp kept out of another
  # branch's snapshot, the MCP server over stdio, and okl intake on this repository's own pull
  # requests. A run of this by hand on 2026-11-07 found four bugs the suite had passed (#390).
  # A job of its own, so its red can neither hide the suite's nor hide behind it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # okl intake reads this repository's review threads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Build a wheel and install it fresh, with the MCP extra
        # What a user gets: no lockfile and no checkout on the path, only the wheel and the
        # versions pip resolves for it today.
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/okl-venv"
          wheel="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          "$RUNNER_TEMP/okl-venv/bin/pip" install "${wheel}[mcp]"

      - name: okl end to end
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/e2e.py --okl "$RUNNER_TEMP/okl-venv/bin/okl"

  # The architecture review, after the jobs that test the change, so it reads what they reported.
  # It ran inside lint-and-test with read-only tools and nothing else, and on a week of okl's own
  # pull requests it passed four changes the same reviewer, given tests and probes to run, found
  # must-fix defects in. It still runs no code itself: the token is in its environment while it
  # reads PR text. The checks run in the jobs it needs, which hold no secret, and their results
  # come in as input. It runs whether they passed or failed: a failure is what it must read.
  review:
    if: always() && github.event_name == 'pull_request'
    needs: [ lint-and-test, tests-other-pythons, e2e ]
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the lesson review's eleven calls, when it is on, after the architecture review
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install from the lockfile
        run: |
          python -m pip install "$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["dev"] if isinstance(d, str) and d.startswith("uv==")))')"
          uv sync --locked --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Collect what the change's checks reported
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ci-results-*
          path: ${{ runner.temp }}/ci-results

      - name: Summarise the check results for the reviewer
        env:
          LINT_AND_TEST: ${{ needs.lint-and-test.result }}
          OTHER_PYTHONS: ${{ needs.tests-other-pythons.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          out="$RUNNER_TEMP/ci-results.md"
          {
            echo "Job results: lint-and-test $LINT_AND_TEST; tests-other-pythons (every version in its matrix) $OTHER_PYTHONS; end to end $E2E."
            for log in "$RUNNER_TEMP"/ci-results/*/*.log; do
              [[ -f "$log" ]] || continue
              echo
              echo "--- $(basename "$(dirname "$log")")/$(basename "$log"), its last 60 lines ---"
              tail -n 60 "$log"
            done
          } > "$out"
          wc -l "$out"

      # The reviewer okl ships, run on okl. It was listed as a review surface with nothing
      # triggering it — the "enforcement surface that only runs on-demand runs never"
      # failure this repo's own store names. It runs on the maintainer's Claude subscription:
      # CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`, bills the subscription and not the
      # API (no ANTHROPIC_API_KEY here, which would outrank it; --bare would ignore it).
      # Without that secret, and on a fork's PR, which gets no secrets, it soft-passes; the
      # REVIEW_CMD variable swaps in any other CLI. The scripts run it from a clean room, so
      # this repo's hooks never fire on it, and --add-dir lets it read the checkout to hold
      # each figure to its receipt. Both reviews below use what this step sets up.
      - name: Set up the reviewer (on the maintainer's Claude subscription)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_CMD: ${{ vars.REVIEW_CMD }}
          # Pinned, as every tool that gates CI is: a release cannot change the gate unseen.
          CLAUDE_CODE_VERSION: "2.1.302"
        run: |
          if [[ -z "$REVIEW_CMD" && -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            # The platform package is the native binary itself and runs no install script,
            # so npm can refuse lifecycle scripts outright.
            npm install --ignore-scripts --no-fund --no-audit --prefix "$RUNNER_TEMP/claude" \
              "@anthropic-ai/claude-code-linux-x64@$CLAUDE_CODE_VERSION"
            CLAUDE_BIN="$RUNNER_TEMP/claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
            chmod +x "$CLAUDE_BIN"
            # Read-only git, so it can check that a receipt's commit is reachable: allowed by a
            # settings file, since the command line is word-split; GIT_DIR points the clean
            # room's git at the checkout. Only forms that cannot write, while the token is in the
            # environment and the model reads PR text: not branch or tag, which create and delete
            # refs (CI reviewer on #307), and not log or show, whose --output writes a file
            # (CodeRabbit on #307). Any other shell command is refused in -p mode.
            printf '%s' '{"permissions":{"allow":["Bash(git merge-base:*)","Bash(git rev-parse:*)"]}}' \
              > "$RUNNER_TEMP/review-settings.json"
            REVIEW_CMD="$CLAUDE_BIN -p --model sonnet --max-turns 40 --tools Read,Grep,Glob,Bash --settings $RUNNER_TEMP/review-settings.json --add-dir $GITHUB_WORKSPACE"
            echo "GIT_DIR=$GITHUB_WORKSPACE/.git" >> "$GITHUB_ENV"
            echo "GIT_WORK_TREE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
          # Set for the steps below, never in their own env: a step's env would override it.
          echo "REVIEW_CMD=$REVIEW_CMD" >> "$GITHUB_ENV"
          # The knowledge layer, from the seed packs in a store that lives for this job; this
          # repo's own recorded lessons stay on the maintainer's machine (#186).
          echo "OKL_DATABASE_URL=sqlite:///$RUNNER_TEMP/review.db" >> "$GITHUB_ENV"
          echo "OKL_BRIEFING_LOG=0" >> "$GITHUB_ENV"
          if OKL_DATABASE_URL="sqlite:///$RUNNER_TEMP/review.db" okl seed seed/ >/dev/null 2>&1; then
            echo "REVIEW_SEEDED=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=review::the seed packs did not load, so neither review has the lessons"
          fi

      # It fails the job on a must-fix finding only.
      - name: Architecture review
        env:
          REVIEW_BASE_REF: origin/${{ github.base_ref }}
          # Receipts, eval rows, the drift snapshot and lockfiles are data: left out of the diff
          # the reviewer reads, listed for it to open. With them in, two of a week's PRs passed
          # the single 4,000-line cut and their code after it went unreviewed.
          REVIEW_EXCLUDE: "*.lock **/*.lock evals/results/** **/*.jsonl okl-drift.json"
          # What the change says it does, passed as data: interpolated into the script, a PR
          # title could run as shell. The reviewer is told it is a claim, not instructions.
          REVIEW_PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # The knowledge layer's briefing for this change, from the seed packs only, and the
          # reviewer is told so.
          briefing="$RUNNER_TEMP/briefing.md"
          if [[ "${REVIEW_SEEDED:-}" == 1 ]] \
             && okl check --task "$REVIEW_PR_TITLE. ${REVIEW_PR_BODY:0:600}" --format agent > "$briefing" 2>/dev/null; then
            printf '\n(From the seed packs only: lessons recorded on the maintainer machine are not in CI.)\n' >> "$briefing"
          else
            briefing=""
          fi
          REVIEW_REPO_DIR="$GITHUB_WORKSPACE" REVIEW_BRIEFING_FILE="$briefing" \
          REVIEW_CI_RESULTS_FILE="$RUNNER_TEMP/ci-results.md" \
            bash ci/review-agent.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # The review after writing, on the pull request: one call picks the ten lessons the change
      # is likeliest to break, then one fresh call checks each (ci/lesson-review.sh). Eleven calls
      # a run, so it is off until the LESSON_REVIEW repository variable is "on". It reports and
      # blocks nothing; the job below posts its report on the pull request.
      - name: Lesson review
        if: ${{ !cancelled() && vars.LESSON_REVIEW == 'on' }}
        timeout-minutes: 30
        env:
          REVIEW_BASE_REF: origin/${{ github.base_ref }}
          REVIEW_EXCLUDE: "*.lock **/*.lock evals/results/** **/*.jsonl okl-drift.json"
          REVIEW_PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LESSON_REVIEW_TIMEOUT: "600"
          # The whole run's limit, under the step's 30 minutes, so the report is written before the
          # runner would stop the step (a pick and three rounds of checks at 600 s each outlast it).
          LESSON_REVIEW_DEADLINE: "1500"
          LESSON_REVIEW_STORE_NOTE: "Checked against okl's seed packs only: the lessons recorded on the maintainer's machine are not in CI (#186)."
        run: |
          if [[ "${REVIEW_SEEDED:-}" != 1 ]]; then
            echo "::warning title=lesson review::not run: the seed packs did not load"
            # A report all the same, so the comment an earlier push left does not stand for this one.
            printf '%s\n### Lesson review\n\nNo review: the seed packs did not load, so this push was not checked against the lessons.\n' \
              '<!-- okl-lesson-review -->' > "$RUNNER_TEMP/lesson-review.md"
            exit 0
          fi
          REVIEW_REPO_DIR="$GITHUB_WORKSPACE" LESSON_REVIEW_REPORT="$RUNNER_TEMP/lesson-review.md" \
            bash ci/lesson-review.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the lesson review's report for the comment
        if: ${{ !cancelled() && vars.LESSON_REVIEW == 'on' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lesson-review
          path: ${{ runner.temp }}/lesson-review.md
          if-no-files-found: ignore
          retention-days: 7


  # The lesson review's report, posted on the pull request as one comment that each run replaces.
  # A job of its own: it holds the token that writes to the pull request and runs no model and none
  # of the change's code, while the review job, which runs both, writes nothing. A fork's pull
  # request gets a read-only token, so there the report stays in the review job's summary.
  lesson-review-comment:
    if: always() && github.event_name == 'pull_request' && vars.LESSON_REVIEW == 'on' && needs.review.result != 'skipped'
    needs: [ review ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Fetch the report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: lesson-review
          path: ${{ runner.temp }}/lesson-review

      - name: Post it, replacing the last one
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/lesson-review/lesson-review.md"
          if [[ ! -s "$body" ]]; then
            echo "no report to post"
            exit 0
          fi
          # The last comment this workflow posted that starts with the report's marker.
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                  --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- okl-lesson-review -->"))) | .id' \
                | tail -n 1)" || id=""
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" > /dev/null \
              || echo "::warning title=lesson review::the report could not replace the last one"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" > /dev/null \
              || echo "::warning title=lesson review::the report could not be posted"
          fi
