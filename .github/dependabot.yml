# Dependabot.
#
# This exists because of the SHA pinning, not despite it. Pinning actions to a commit
# closes the "a mutable tag moved under me" hole and opens a quieter one: the pin never
# updates, so a security fix in an action never arrives. Pinning without an update path
# is how a repo ends up on a two-year-old checkout action and calls it hardening.
# Dependabot rewrites the SHA and the trailing `# v5` comment together.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # uv, not pip: the uv ecosystem moves uv.lock with pyproject.toml, where pip moved only
  # pyproject.toml and the lock drifted from it for weeks (#285). Both run dependabot-core's
  # python requirements updater (uv aliases it), so versioning-strategy reads the same.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    # Move a requirement only when the new release falls outside it. The extras users
    # install are ranges on purpose (a published package has to coexist with its users'
    # other dependencies), and the default strategy raised their floors to each new release
    # (#248, #249), narrowing what okl installs beside for no reason. With this, a range
    # such as pydantic>=2 is left alone and an exact gate pin such as ruff==0.16.10 still
    # becomes ruff==0.17.1 (dependabot-core's python requirements_updater, checked
    # 2026-10-24). Raising a floor is a deliberate edit, made when okl needs the newer release.
    versioning-strategy: increase-if-necessary
    # The gating tools are pinned exactly on purpose (a range lets a new release
    # retro-fail a branch that changed nothing). Dependabot is the intended way to move
    # those pins: a PR that runs the full suite against the new version before it lands,
    # rather than a range that upgrades silently mid-branch.
    groups:
      dev-tooling:
        patterns: ["pytest", "ruff", "mypy", "uv"]
