# Steps as produced by the briefed session (evals/results/e2e-20260926/transcript-briefed.jsonl),
# wrapped in the minimal job a user would put them in.
name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.9.0
      - name: Lint — ruff
        run: ruff check app/
