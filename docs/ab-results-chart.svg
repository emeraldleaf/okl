<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fcfcfb"/>

  <text x="600" y="136" font-size="46" fill="#52514e" text-anchor="middle">Known defects in agent-written code</text>

  <text x="288" y="430" font-size="210" font-weight="700" fill="#2a78d6" text-anchor="middle">33%</text>
  <text x="600" y="414" font-size="130" fill="#a8a7a1" text-anchor="middle">→</text>
  <text x="912" y="430" font-size="210" font-weight="700" fill="#eb6834" text-anchor="middle">4%</text>

  <text x="288" y="504" font-size="41" fill="#0b0b0b" text-anchor="middle">rules written down</text>
  <text x="288" y="554" font-size="41" fill="#0b0b0b" text-anchor="middle">but not delivered</text>
  <text x="912" y="504" font-size="41" fill="#0b0b0b" text-anchor="middle">rules retrieved into</text>
  <text x="912" y="554" font-size="41" fill="#0b0b0b" text-anchor="middle">context, every task</text>

  <line x1="140" y1="644" x2="1060" y2="644" stroke="#e6e5e1" stroke-width="1"/>

  <text x="600" y="722" font-size="43" fill="#0b0b0b" text-anchor="middle">Same model, same tasks. The only difference:</text>
  <text x="600" y="776" font-size="43" fill="#0b0b0b" text-anchor="middle">whether anything put them in front of the agent.</text>

  <rect x="140" y="842" width="920" height="164" rx="16" fill="#f4f3f0"/>
  <text x="600" y="908" font-size="41" fill="#0b0b0b" text-anchor="middle">A budget model with the rules (12%) beat</text>
  <text x="600" y="960" font-size="41" fill="#0b0b0b" text-anchor="middle">a frontier model without them (33%).</text>

  <text x="600" y="1072" font-size="26" fill="#82817c" text-anchor="middle">8 tasks, 3 samples per arm, graded blind by a second, different model.</text>
  <text x="600" y="1110" font-size="26" fill="#82817c" text-anchor="middle">Measures defect classes the store covers, not general code quality. Small n.</text>
  <text x="600" y="1152" font-size="26" fill="#82817c" text-anchor="middle">Method and receipts: github.com/emeraldleaf/okl</text>
</svg>
