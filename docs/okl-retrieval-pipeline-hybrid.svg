<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1492" viewBox="0 0 980 1492" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="980" height="1492" fill="#F5F3F0"/>
<text x="28" y="46" font-size="27" font-weight="700" fill="#1E1B18">How an okl briefing gets built with the semantic arm on</text>
<text x="28" y="72" font-size="14" fill="#4E4740">Under the word floor, 183 records and one task sentence become the 12 or fewer an agent reads. A local embedding adds candidates by</text>
<text x="28" y="90" font-size="14" fill="#4E4740">meaning; five stages then narrow them.</text>
<text x="28" y="114" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">GENERATED from the live pipeline - docs/render_pipeline_diagram.py</text>
<text x="28" y="130" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">traced task: "Add an endpoint that returns a single order by id for the signed-in user."</text>
<text x="28" y="146" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">searched as: "Add endpoint returns single order id signed user"</text>
<text x="28" y="162" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">repo interests: python, method, security, agent-safety, retrieval-design, eval-integrity, data-quality</text>
<rect x="28" y="172" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="172" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="214" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">0</text>
<text x="65" y="232" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">STORE</text>
<text x="120" y="197" font-size="15" font-weight="600" fill="#1E1B18">The corpus</text>
<text x="120" y="216" font-size="12" fill="#4E4740">Every record carries scope (permission), tags (subject), applies_to (validity) and files (what it governs). Nothing is ranked yet.</text>
<text x="120" y="250" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">183 records</text>
<rect x="120" y="256" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="256" width="818" height="9" rx="2" fill="#B4531F"/>
<rect x="28" y="276" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="276" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="318" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">1</text>
<text x="65" y="336" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">QUERY</text>
<text x="120" y="301" font-size="15" font-weight="600" fill="#1E1B18">The task's subject words, not the sentence</text>
<text x="120" y="320" font-size="12" fill="#4E4740">Function words, chat filler and single characters drop out; each word counts once, up to 40. No subject word, or a message a harness</text>
<text x="120" y="335" font-size="12" fill="#4E4740">wrote, is briefed nothing.</text>
<text x="120" y="354" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">8 words</text>
<text x="938" y="354" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">searched</text>
<rect x="28" y="380" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="380" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="422" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">2</text>
<text x="65" y="440" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">RANK</text>
<text x="120" y="405" font-size="15" font-weight="600" fill="#1E1B18">Full text: fetch 3x more candidates than needed</text>
<text x="120" y="424" font-size="12" fill="#4E4740">SQLite FTS5, weighted title x8, body x4, symptom x4, aliases x4, triggers x4, fix x2, tags x1. A record found only by its tag ranks</text>
<text x="120" y="439" font-size="12" fill="#4E4740">after every content match.</text>
<text x="120" y="458" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">108 fetched</text>
<text x="938" y="458" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">limit x 3, widened x3 by the floor</text>
<rect x="120" y="464" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="464" width="627" height="9" rx="2" fill="#B4531F"/>
<rect x="28" y="484" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="484" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="526" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">2b</text>
<text x="65" y="544" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">EMBED</text>
<text x="120" y="509" font-size="15" font-weight="600" fill="#1E1B18">The task as one 512-dimension vector; the nearest records by cosine</text>
<text x="120" y="528" font-size="12" fill="#4E4740">A local static model (potion-retrieval-32M) read from the cache, never the network; the vectors come from `okl embed`. One matrix</text>
<text x="120" y="543" font-size="12" fill="#4E4740">product over every record.</text>
<text x="120" y="562" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">108 nearest</text>
<text x="938" y="562" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">33 not in the full-text list</text>
<rect x="120" y="568" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="568" width="627" height="9" rx="2" fill="#B4531F"/>
<rect x="28" y="588" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="588" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="630" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">2c</text>
<text x="65" y="648" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">FUSE</text>
<text x="120" y="613" font-size="15" font-weight="600" fill="#1E1B18">Two orders become one: linear fusion</text>
<text x="120" y="632" font-size="12" fill="#4E4740">linear: a convex combination of a rank-normalised full-text score and the min-max cosine (alpha 0.5). rrf: reciprocal ranks summed (k =</text>
<text x="120" y="647" font-size="12" fill="#4E4740">60). Measured in REPORT 4q.</text>
<text x="120" y="666" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">141 candidates</text>
<rect x="120" y="672" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="672" width="818" height="9" rx="2" fill="#B4531F"/>
<rect x="28" y="692" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="692" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="734" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">3</text>
<text x="65" y="752" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">SCOPE</text>
<text x="120" y="717" font-size="15" font-weight="600" fill="#1E1B18">Permission - who may see this</text>
<text x="120" y="736" font-size="12" fill="#4E4740">A repo's own records pass first and unconditionally. org records continue. Another repo's records stop here: the curation boundary.</text>
<text x="938" y="717" font-size="9.5" fill="#9B3B3B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" text-anchor="end" letter-spacing="0.8">DROPS</text>
<text x="120" y="770" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">124 survive</text>
<text x="938" y="770" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">17 dropped: other repos</text>
<rect x="120" y="776" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="776" width="719" height="9" rx="2" fill="#B4531F"/><rect x="839" y="776" width="99" height="9" rx="2" fill="#9B3B3B" opacity="0.4"/>
<rect x="28" y="796" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="796" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="838" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">4</text>
<text x="65" y="856" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">VALID</text>
<text x="120" y="821" font-size="15" font-weight="600" fill="#1E1B18">applies_to - the only filter allowed to exclude</text>
<text x="120" y="840" font-size="12" fill="#4E4740">EXCLUSIVE. Set by hand on 50 of 183 records, only where a lesson is false off-stack. Unset means anywhere, which is why it is safe.</text>
<text x="938" y="821" font-size="9.5" fill="#9B3B3B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" text-anchor="end" letter-spacing="0.8">DROPS</text>
<text x="120" y="874" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">108 survive</text>
<text x="938" y="874" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">16 dropped: off-stack</text>
<rect x="120" y="880" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="880" width="627" height="9" rx="2" fill="#B4531F"/><rect x="747" y="880" width="93" height="9" rx="2" fill="#9B3B3B" opacity="0.4"/>
<rect x="28" y="900" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="900" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="942" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">5</text>
<text x="65" y="960" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">SUBJECT</text>
<text x="120" y="925" font-size="15" font-weight="600" fill="#1E1B18">tags x interests - one shared subject is enough</text>
<text x="120" y="944" font-size="12" fill="#4E4740">INCLUSIVE. Untagged always passes. The exclusive version was reverted (REPORT 4d): it hid 35 of 172 records and the briefed arm then</text>
<text x="120" y="959" font-size="12" fill="#4E4740">reproduced a defect it dropped.</text>
<text x="938" y="925" font-size="9.5" fill="#4A6B3D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" text-anchor="end" letter-spacing="0.8">ANY-MATCH</text>
<text x="120" y="978" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">78 survive</text>
<text x="938" y="978" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">30 dropped: no shared subject</text>
<rect x="120" y="984" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="984" width="453" height="9" rx="2" fill="#B4531F"/><rect x="573" y="984" width="174" height="9" rx="2" fill="#9B3B3B" opacity="0.4"/>
<rect x="28" y="1004" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="1004" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="1046" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">6</text>
<text x="65" y="1064" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">FLOOR</text>
<text x="120" y="1029" font-size="15" font-weight="600" fill="#1E1B18">Two shared words, one rare word, a one-word alias, or a cosine &gt;= 0.40</text>
<text x="120" y="1048" font-size="12" fill="#4E4740">Only-by-embedding records count by meaning alone (0 kept so). A title or symptom word counts alone if at most 5%, or 5, of records hold</text>
<text x="120" y="1063" font-size="12" fill="#4E4740">it; others need two words.</text>
<text x="938" y="1029" font-size="9.5" fill="#9B3B3B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" text-anchor="end" letter-spacing="0.8">DROPS</text>
<text x="120" y="1082" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">16 survive</text>
<text x="938" y="1082" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">62 dropped: one shared word, 0 retired</text>
<rect x="120" y="1088" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="1088" width="93" height="9" rx="2" fill="#B4531F"/><rect x="213" y="1088" width="360" height="9" rx="2" fill="#9B3B3B" opacity="0.4"/>
<rect x="28" y="1108" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="1108" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="1150" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">7</text>
<text x="65" y="1168" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">CUTOFF</text>
<text x="120" y="1133" font-size="15" font-weight="600" fill="#1E1B18">The top 12</text>
<text x="120" y="1152" font-size="12" fill="#4E4740">Ranking already put the best first; the cut keeps the briefing short. The number cut travels with the result.</text>
<text x="938" y="1133" font-size="9.5" fill="#9B3B3B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" text-anchor="end" letter-spacing="0.8">TRUNCATES</text>
<text x="120" y="1186" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">12 delivered</text>
<text x="938" y="1186" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">4 trimmed</text>
<rect x="120" y="1192" width="818" height="9" rx="2" fill="#EBE7E1"/><rect x="120" y="1192" width="70" height="9" rx="2" fill="#B4531F"/><rect x="190" y="1192" width="23" height="9" rx="2" fill="#9B3B3B" opacity="0.4"/>
<rect x="28" y="1212" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="1212" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="1254" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">8</text>
<text x="65" y="1272" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">SHAPE</text>
<text x="120" y="1237" font-size="15" font-weight="600" fill="#1E1B18">Bucket by type, then route to imperatives</text>
<text x="120" y="1256" font-size="12" fill="#4E4740">Buckets: gates, defects, retractions, tombstones, threat prior-art, rules, decisions, vocabulary, related context. Stale demotes, never</text>
<text x="120" y="1271" font-size="12" fill="#4E4740">deletes. Then ARM / FIX / AVOID.</text>
<text x="120" y="1290" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">gates -&gt; defects+rules</text>
<text x="938" y="1290" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A" text-anchor="end">-&gt; retractions -&gt; tombstones</text>
<rect x="28" y="1316" width="924" height="98" fill="#FFFFFF" stroke="#DCD6CE"/>
<rect x="28" y="1316" width="74" height="98" fill="#EBE7E1" stroke="#DCD6CE"/>
<text x="65" y="1358" font-size="26" font-weight="700" fill="#B4531F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">9</text>
<text x="65" y="1376" font-size="9" fill="#7C736A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="1">RENDER</text>
<text x="120" y="1341" font-size="15" font-weight="600" fill="#1E1B18">Three surfaces, one pipeline</text>
<text x="120" y="1360" font-size="12" fill="#4E4740">agent | actions | json. A zero-match result carries the store size, so 'no rules apply' can never be confused with 'the store is empty'.</text>
<text x="120" y="1394" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1E1B18" font-weight="500">hook | MCP | CI</text>
<text x="28" y="1440" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">src/okl/core.py briefing_terms() / ranked_candidates() / _live_hits() / _in_scope()</text>
<text x="28" y="1454" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">_apply_floor() . src/okl/store.py search() . src/okl/semantic.py search()</text>
<text x="28" y="1468" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7C736A">regenerate: python3 docs/render_pipeline_diagram.py --hybrid linear</text>
</svg>
