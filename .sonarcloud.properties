# SonarQube Cloud automatic analysis for okl (read from the default branch).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis
#
# The hooks, the gates and the CI verifier exist in byte-identical copies: the repo's own
# (hooks/, gates/, .claude/hooks/, ci/okl-verify.yml) and the shipped scaffold under src/okl/
# scaffold/, held equal by tests/test_scaffold.py::test_mirror_files_identical. Only the
# shipped copies are analysed, so each finding is reported once.
sonar.sources=src,evals,ci,docs,examples,.github
sonar.exclusions=ci/okl-verify.yml
sonar.tests=tests
# requires-python is >=3.10 and CI tests 3.10 through 3.14.
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
