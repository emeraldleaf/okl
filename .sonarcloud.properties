# SonarQube Cloud automatic analysis for okl (read from the default branch).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis
#
# The hooks, the gates and the CI verifier exist in byte-identical copies: the repo's own
# (hooks/, gates/, .claude/hooks/, ci/okl-verify.yml, .github/workflows/okl-verify.yml) and
# the shipped scaffold under src/okl/scaffold/, held equal by
# tests/test_scaffold.py::test_mirror_files_identical. Only the shipped copies are analysed,
# so each finding is reported once.
sonar.sources=src,evals,ci,docs,examples,.github
sonar.exclusions=ci/okl-verify.yml,.github/workflows/okl-verify.yml
sonar.tests=tests
# requires-python is >=3.11 and CI tests 3.11 through 3.15. SonarQube Cloud documents
# 3.0 to 3.14 as supported (checked 2026-10-25), so 3.15 joins when it is listed.
sonar.python.version=3.11, 3.12, 3.13, 3.14
