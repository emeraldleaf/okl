[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name only. The CLI command, the import package, and the repo are all `okl`;
# PyPI rejects `okl` as too similar to the existing `oki` (l/i are treated as confusable).
name = "org-knowledge-layer"
version = "0.4.1"
description = "Org Knowledge Layer — an installable sixth surface that carries encoded engineering lessons across repos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Dell" }]
keywords = ["ai-engineering", "knowledge-layer", "mcp", "agentic-coding", "encoding-loop"]
dependencies = []  # local + client path is stdlib-only

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=1.2"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "psycopg[binary]>=3.1", "mcp>=1.2"]
dev = [
  # Gating tools are pinned exactly: a range lets a new release retro-fail a branch
  # that changed nothing, which is a recorded defect in this repo's own store.
  # Verified against PyPI and run green here on 2026-09-02, rather than a
  # plausible-looking guess: an invented version 404s the install step.
  "pytest==8.4.2", "pytest-cov==7.1.0", "ruff==0.16.5", "mypy==2.3.1",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "httpx>=0.27",
]

[project.scripts]
okl = "okl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/okl"]

[tool.hatch.build.targets.wheel.force-include]
# scaffold/ lives under src/okl and is shipped by `packages` above; only seed/ is external.
"seed" = "okl/seed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["okl"]
# The scaffold directory is template content copied into other repos, not code this
# suite executes.
omit = ["*/scaffold/*"]

[tool.coverage.report]
# A ratchet at the level measured IN THE CI ENVIRONMENT on 2026-09-02, not an
# aspiration. The distinction matters and cost a red build: locally, with the optional
# psycopg and mcp extras installed, coverage reads 69%; CI installs only [dev], so those
# paths are unreachable and their tests skip, and the true figure is 66.7%. A threshold
# read off a developer's machine fails on a runner that has less installed.
#
# It should only ever be raised. The weak spots it is deliberately NOT hiding:
# bootstrap.py has no test at all, and cli.py sits at 49%.
fail_under = 66
show_missing = true

[tool.mypy]
python_version = "3.10"
files = ["src/okl"]
# Not --strict yet: that is 94 findings, mostly missing annotations on internal helpers
# and Any returns. Tracked as a follow-up rather than a blanket ignore, so the gate that
# exists is one that actually passes.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# psycopg and mcp are OPTIONAL extras: the core install has neither, and CI installs
# only [dev]. Naming them here rather than passing --ignore-missing-imports globally
# keeps a genuine typo in a first-party import an error.
module = ["psycopg", "psycopg.*", "mcp", "mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modernize, B bugbear-lite via flake8-bugbear set
# S = security (bandit), C90 = complexity, SIM/RET/PERF = simplification,
# A = builtin shadowing, DTZ = naive datetimes, PTH = pathlib over os.path.
select = ["E", "W", "F", "I", "UP", "B", "S", "C90", "SIM", "RET", "PERF", "A", "DTZ", "PTH", "N"]
ignore = [
  "E501",  # long lines: docstrings and CLI help text read better unwrapped
  "E702",  # semicolon one-liners: deliberate compact setup style throughout the tests
  "A002",  # `type`/`id` shadow builtins — but they ARE the domain vocabulary here, and
           # the seed file format uses those exact keys. Renaming the public API to
           # satisfy a style rule would break every consumer and every seed pack.
  "S603",  # subprocess without shell: every call site is list-form with a `--` guard
  "S607",  # partial executable path: `git` is resolved from PATH deliberately, so the
           # caller's toolchain wins (a hardcoded /usr/bin/git breaks nix, brew, CI images)
  "S104",  # `okl serve --host 0.0.0.0`: the default exists so the service is reachable
           # from outside its container, which is the only way a shared instance works.
           # OKL_TOKEN gates every route; the deploy doc says to put a proxy in front.
  "S602",  # the single shell=True is `okl verify --run "<cmd>"`, where the command is
           # typed by the person running it. No stored field ever reaches a shell —
           # that boundary is the rule "never let stored data reach a shell".
]

[tool.ruff.lint.mccabe]
# 12, not the default 10: the two registration functions (service.create_app,
# mcp_server._build) are declarative route/tool tables whose "complexity" is an artifact
# of nested definitions. Splitting them would scatter one readable table across helpers.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests assert on subprocess output and build temp paths; the security rules aimed at
# production input handling produce only noise there.
"tests/*" = ["S101", "S603", "S607", "S108", "S608"]
# The harness is a measurement script, not shipped code: its main() is a linear
# experiment procedure whose "complexity" is the number of arms and guards it runs.
"evals/*" = ["S101", "S603", "S607", "C901"]
